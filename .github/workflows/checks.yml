name: Library and showcase

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install the locked environment
        run: |
          python -m pip install uv==0.12.3
          uv sync --extra dev --extra vi --extra notebook --locked
      - name: Check library and comparisons
        run: .venv/bin/python -m pytest -q
      - name: Build showcase from executed notebooks
        run: .venv/bin/python -m examples.build_site
      - name: Validate static site
        run: |
          .venv/bin/python -m examples.check_site
          node --check website/app.js
          node --check website/neural.js
      - name: Prepare the checked site for Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_PUBLIC_PAGES == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_PUBLIC_PAGES == 'true'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish showcase
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
